<svg xmlns="http://www.w3.org/2000/svg" width="920" height="420" viewBox="0 0 920 420" role="img" aria-label="What the agentrouter-connector repository takes care of">
  <title>What this repository takes care of</title>
  <rect width="920" height="420" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">What this repository takes care of</text>
  <text x="460" y="56" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">Two components, one upstream. Keys live in environment variables only.</text>

  <rect x="30" y="80" width="410" height="220" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="235" y="108" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">Root HTTP connector (v2)</text>
  <text x="235" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">src/ · Dockerfile · :3000</text>
  <text x="235" y="156" font-family="sans-serif" font-size="13" fill="#334155">• /mcp and OpenAI-compatible /v1 endpoints</text>
  <text x="235" y="178" font-family="sans-serif" font-size="13" fill="#334155">• Concurrency limit, retries, fallback routes</text>
  <text x="235" y="200" font-family="sans-serif" font-size="13" fill="#334155">• Prompt redaction and usage ledger</text>
  <text x="235" y="222" font-family="sans-serif" font-size="13" fill="#334155">• Run: npm start, or docker compose up</text>
  <text x="235" y="244" font-family="sans-serif" font-size="13" fill="#334155">• Docs: docs/PROCESS.md</text>
  <text x="235" y="276" font-family="sans-serif" font-size="13" fill="#334155">• CI: root tests + build on push / PR</text>

  <rect x="480" y="80" width="410" height="220" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="685" y="108" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">Stdio MCP server (mcp-server/)</text>
  <text x="685" y="130" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Local Node process, stdin/stdout only</text>
  <text x="685" y="156" font-family="sans-serif" font-size="13" fill="#334155">• Six tools: list, chat, batch, health,</text>
  <text x="685" y="178" font-family="sans-serif" font-size="13" fill="#334155">  diagnose, generate_config</text>
  <text x="685" y="200" font-family="sans-serif" font-size="13" fill="#334155">• Host × key rotation and classified errors</text>
  <text x="685" y="222" font-family="sans-serif" font-size="13" fill="#334155">• Per-combo ledger, no key values in logs</text>
  <text x="685" y="244" font-family="sans-serif" font-size="13" fill="#334155">• Run: npm run build, then register in Codex /</text>
  <text x="685" y="266" font-family="sans-serif" font-size="13" fill="#334155">  Claude Code — no browser URL</text>

  <rect x="30" y="320" width="860" height="70" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="460" y="348" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="700" fill="#0f172a">Does NOT take care of</text>
  <text x="460" y="372" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Account provisioning · quota or billing · model availability (the list is dynamic) · gateway outages · chained-session state</text>
</svg>
