<svg xmlns="http://www.w3.org/2000/svg" width="920" height="560" viewBox="0 0 920 560" role="img" aria-label="AgentRouter MCP request flow with host by key rotation">
  <title>AgentRouter MCP request flow</title>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#334155"/></marker>
    <marker id="arrowRetry" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b45309"/></marker>
  </defs>
  <rect width="920" height="560" fill="#ffffff"/>
  <text x="460" y="32" text-anchor="middle" font-family="sans-serif" font-size="22" font-weight="700" fill="#0f172a">AgentRouter MCP — how a request flows (v2)</text>
  <text x="460" y="56" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#475569">Stdio on your machine only. No browser URL. Keys stay in environment variables, never in the ledger.</text>

  <!-- Client -->
  <rect x="30" y="90" width="200" height="96" rx="12" fill="#eef2ff" stroke="#6366f1" stroke-width="2"/>
  <text x="130" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">Your terminal / client</text>
  <text x="130" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Codex or Claude Code</text>
  <text x="130" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">MCP tools: chat, batch, health…</text>

  <!-- MCP server -->
  <rect x="300" y="90" width="220" height="96" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="410" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">MCP server (stdio)</text>
  <text x="410" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">dist/src/server.js</text>
  <text x="410" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">stdout = MCP traffic only</text>

  <!-- Gateway -->
  <rect x="590" y="90" width="200" height="96" rx="12" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/>
  <text x="690" y="118" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">AgentRouter gateway</text>
  <text x="690" y="140" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">agentrouter.org / backup host</text>
  <text x="690" y="160" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">codex_cli_rs headers</text>

  <!-- Azure -->
  <rect x="820" y="90" width="70" height="96" rx="12" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <text x="855" y="125" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="700" fill="#0f172a">Azure</text>
  <text x="855" y="145" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#0f172a">pool</text>
  <text x="855" y="165" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#334155">model</text>

  <line x1="230" y1="138" x2="300" y2="138" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="520" y1="138" x2="590" y2="138" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="790" y1="138" x2="820" y2="138" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Rotation box -->
  <rect x="300" y="230" width="490" height="150" rx="12" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
  <text x="545" y="258" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">Rotation: 2 hosts × 2 keys, up to 3 rounds = 12 attempts</text>
  <text x="545" y="282" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">agentrouter.org/key1 → agentrouter.org/key2 → ps.air-outer.com/key1 → ps.air-outer.com/key2 → repeat</text>
  <text x="545" y="306" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Pause 2–5 s + jitter between attempts. Responses timeout 600 s. Astra chat default 12,000 tokens (max 16,000).</text>
  <text x="545" y="330" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Retryable: 401, 402, 403, 429, 502, 503, 504 + transport failures. Non-retryable: 400, 404 and other 4xx.</text>
  <text x="545" y="354" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Astra batch default: sequential (1). Other models: up to 8. At most 32 tasks per batch.</text>

  <line x1="410" y1="186" x2="410" y2="230" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 790 230 L 790 210 L 545 210" fill="none" stroke="#b45309" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrowRetry)"/>
  <text x="800" y="205" font-family="sans-serif" font-size="12" fill="#b45309">retryable failure:</text>
  <text x="800" y="221" font-family="sans-serif" font-size="12" fill="#b45309">next combo</text>

  <!-- Outcomes -->
  <rect x="30" y="420" width="410" height="96" rx="12" fill="#ecfdf5" stroke="#059669" stroke-width="2"/>
  <text x="235" y="448" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">Success → reply to your client</text>
  <text x="235" y="470" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Batch results stay in input order, per task:</text>
  <text x="235" y="490" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">index, attempts, host, keyIndex — re-submit only failures.</text>

  <rect x="480" y="420" width="410" height="96" rx="12" fill="#fef2f2" stroke="#dc2626" stroke-width="2"/>
  <text x="685" y="448" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="700" fill="#0f172a">Failure → classified error, not a dead key</text>
  <text x="685" y="470" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">upstream-transient · pool-quota-403 · no-channel · auth-client …</text>
  <text x="685" y="490" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#334155">Every attempt is logged: host, key index, kind, latency. Never a key value.</text>

  <line x1="545" y1="380" x2="235" y2="420" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="545" y1="380" x2="685" y2="420" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="460" y="540" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#64748b">What it does NOT do: provision accounts, grant quota, make a model available, fix the gateway, or protect a chained Codex session.</text>
</svg>
